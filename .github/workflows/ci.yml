name: CI

# Runs on every push/PR. Nothing in this pipeline requires a real LLM
# provider API key -- the crew runs against the deterministic offline
# MockLLM (see src/fraud_crew/infrastructure/llm.py), so CI is fully
# self-contained and reproducible for any fork/clone.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Unit tests (pytest)
        env:
          # Explicitly unset in case a runner ever has these set; CI must
          # always exercise the offline MockLLM path.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          CREWAI_TRACING_ENABLED: "false"
        run: pytest -v --cov=fraud_crew --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fraud-aml-investigation-crew:ci .
